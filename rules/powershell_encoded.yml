title: Suspicious PowerShell Encoded Command
id: 8f2b7c1a-4e3d-4f91-9a62-1c5d8b7e3a20

logsource:
  product: windows
  category: process_creation


detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: '-EncodedCommand'
  condition: selection 
level: medium
status: experimental
description: Detects PowerShell processes using the EncodedCommand parameter, which may indicate obfuscated command execution.
author: Sepehr Naji

tags:
  - attack.execution
  - attack.t1059.001